- name: Install My SQL server and run it
  hosts: mysql
  become: yes
  vars:
    mysql_root_password: "ExpenseApp@1" # Set a strong root password for MySQL
  tasks:
    - name: Install mysql libraries # Install the necessary MySQL client libraries for Python
      ansible.builtin.pip:
        name: "{{ item }}"
        executable: pip3.9 # Use pip3.9 to ensure compatibility with Python 3.9
      loop:
        - cryptography # Required for PyMySQL
        - PyMySQL # MySQL client library for Python
  
    - name: Install MySQL server # Install the MySQL server package
      ansible.builtin.package:
        name: mysql-server
        state: installed

    - name: start and enable MySQL service # Start and enable the MySQL service to ensure it runs on boot
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: yes

    - name: connect to MySQL # Set the root password and create the 'expense_db' database
      community.mysql.mysql_user:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_host: mysql.erothi.online
      register: mysql_info # Register the result of the MySQL user creation task to check for errors      
      ignore_errors: yes # Ignore errors in case the root user already exists

    - name: print mysql info # Print the MySQL user creation result for debugging purposes
      ansible.builtin.debug:
        msg: "MySQL user creation result: {{ mysql_info }}"

    - name: setup root password # Set the root password for MySQL if it was not set during user creation
      ansible.builtin.command: "mysql_secure_installation --set-root-password {{ mysql_root_password }} "
      when: mysql_info is failed # Only run this task if the previous task failed, indicating that the root user already exists