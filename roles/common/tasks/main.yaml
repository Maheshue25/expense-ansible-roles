- name: remove existing directory for application # Remove the existing directory for the application to ensure a clean setup
  ansible.builtin.file:
    path: "{{ APP_LOCATION }}" # for backend /app and for frontend /usr/share/nginx/html
    state: absent

- name: Create a directory for the application # Create a directory for the application and set ownership to the 'expense' user
  ansible.builtin.file:
    path: "{{ APP_LOCATION }}" # for backend /app and for frontend /usr/share/nginx/html
    state: directory

- name: Download the application code using link # Download the application code from the specified URL and save it to the appropriate directory
  ansible.builtin.unarchive:
    src: "https://expense-builds.s3.us-east-1.amazonaws.com/expense-{{ COMPONENT }}-v2.zip" # Dynamically construct the URL for the application code based on the component (backend or frontend)
    dest: "{{ APP_LOCATION }}" # for backend /app and for frontend /usr/share/nginx/html
    remote_src: yes